map $http_host $geocsv_loopback_host {
    default "";
    ~^127\.0\.0\.1(?<geocsv_port>:[0-9]+)?$ localhost$geocsv_port;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Multer enforces the existing per-file upload limit.
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        # Protomaps Hosted API recognizes localhost as the local development origin.
        if ($geocsv_loopback_host != "") {
            return 307 $scheme://$geocsv_loopback_host$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }
}
