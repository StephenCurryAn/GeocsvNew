name: Analysis regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:16-3.7
        env:
          POSTGRES_DB: geocsv_analysis_test
          POSTGRES_USER: geocsv
          POSTGRES_PASSWORD: geocsv_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U geocsv -d geocsv_analysis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"
      - run: uv python install 3.12.13
      - run: uv sync --locked --python 3.12.13 --project agent_service
      - run: uv sync --locked --python 3.12.13 --project python_engine
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm run build --prefix server
      - run: npm test --prefix server
      - run: node --experimental-strip-types --test client/tests/*.test.mjs
      - run: uv run --locked --directory agent_service python -m unittest discover -s tests
      - run: uv run --locked --directory python_engine python -m unittest discover -s tests
      - name: Verify PostGIS migrations and execution
        run: npm run test:integration --prefix server
        env:
          TEST_DATABASE_URL: postgresql://geocsv:geocsv_test@127.0.0.1:${{ job.services.postgis.ports[5432] }}/geocsv_analysis_test
          SCENE_TEST_DATABASE_URL: postgresql://geocsv:geocsv_test@127.0.0.1:${{ job.services.postgis.ports[5432] }}/geocsv_analysis_test
